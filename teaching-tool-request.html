<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>其他教學工具需求討論｜護理教育 Learning Hub</title>
<style>
:root{--bg:#FAF8F7;--primary:#739F99;--primary-dark:#527F79;--primary-soft:#EAF3F1;--rose:#D9A6A6;--rose-dark:#936B6B;--rose-soft:#F8EDED;--yellow-soft:#FFF4DB;--text:#33383D;--muted:#777D81;--line:#E9E5E2;--shadow:0 12px 34px rgba(70,65,62,.07)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top right,rgba(217,166,166,.13),transparent 28%),radial-gradient(circle at top left,rgba(115,159,153,.11),transparent 30%),var(--bg);line-height:1.65}.wrap{width:min(100%,820px);margin:auto;padding:14px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.back{text-decoration:none;color:var(--primary-dark);padding:9px 11px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;font-weight:900}.badge{padding:7px 10px;border-radius:999px;background:var(--yellow-soft);color:#8A6A35;font-size:11px;font-weight:900}.hero,.card{border:1px solid var(--line);background:rgba(255,255,255,.97);box-shadow:var(--shadow)}.hero{padding:27px 24px;border-radius:24px;background:linear-gradient(145deg,#fff,#F7F4EC);margin-bottom:12px}.hero h1{margin:0 0 7px;font-size:clamp(29px,6vw,40px);line-height:1.18}.hero p{margin:0;color:var(--muted);font-size:14px}.card{padding:21px;border-radius:20px;margin-bottom:12px}.card h2{margin:0 0 4px;font-size:20px}.note{margin:0 0 15px;color:var(--muted);font-size:12.5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;font-size:13.5px;font-weight:900}.required{color:var(--rose-dark)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:13px;background:#FCFBFA;color:var(--text);font:inherit;outline:none}input,select{min-height:52px;padding:12px 13px}textarea{min-height:120px;padding:12px 13px;resize:vertical}input:focus,textarea:focus,select:focus{background:#fff;border-color:rgba(115,159,153,.62);box-shadow:0 0 0 4px rgba(115,159,153,.09)}.helper{margin-top:5px;color:var(--muted);font-size:11.5px}.check{display:flex;gap:9px;padding:12px;border:1px solid rgba(232,201,143,.5);border-radius:13px;background:var(--yellow-soft);cursor:pointer}.check input{width:19px;height:19px;min-height:0;margin:2px 0 0;accent-color:var(--primary)}.check strong{display:block;font-size:13px}.check span span{display:block;color:#756A59;font-size:11.5px}.privacy{padding:12px 13px;border-radius:13px;background:var(--primary-soft);color:#557773;font-size:11.5px}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:14px}.secondary,.primary{min-height:52px;border-radius:13px;font:inherit;font-weight:900;cursor:pointer}.secondary{border:1px solid var(--line);background:#fff;color:var(--primary-dark)}.primary{border:0;background:#B38C49;color:#fff}.primary:disabled{opacity:.58;cursor:default}.status{display:none;margin-top:12px;padding:13px;border-radius:13px;font-size:12.5px}.status.show{display:block}.status.ok{background:var(--primary-soft);color:#4F756E}.status.wait{background:var(--yellow-soft);color:#7D673E}.status.err{background:var(--rose-soft);color:#8B6262}.success{display:none;text-align:center}.success.show{display:block}.success-icon{width:58px;height:58px;margin:0 auto 12px;display:grid;place-items:center;border-radius:19px;background:var(--primary-soft);font-size:26px}.success h2{margin:0 0 7px;font-size:25px}.request{display:inline-block;margin-top:10px;padding:8px 11px;border-radius:999px;background:#F5F2F0;font-size:11px;font-weight:900}@media(max-width:650px){.wrap{padding:9px 9px 48px}.hero{padding:22px 18px}.card{padding:16px}.grid2,.actions{grid-template-columns:1fr}input,select{min-height:56px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="back" href="index.html">← 回 Learning Hub</a><span class="badge">教學工具需求</span></div>
<section class="hero"><h1>其他教學工具需求討論</h1><p>還不確定要做成什麼也沒關係。先告訴我們想教什麼、目前遇到的問題，以及希望學員最後能做到什麼。</p></section>
<form id="form" onsubmit="submitRequest(event)">
<section class="card"><h2>1｜申請與聯繫資料</h2><p class="note">以下資料皆為必填，方便後續確認需求與聯繫。</p><div class="grid2"><div class="field"><label for="unit">單位 <span class="required">*</span></label><input id="unit" required placeholder="例如：11B"></div><div class="field"><label for="applicant">申請人 <span class="required">*</span></label><input id="applicant" required autocomplete="name" placeholder="請輸入姓名"></div><div class="field"><label for="email">院內信箱 <span class="required">*</span></label><input id="email" type="email" required autocomplete="email" pattern="[A-Za-z0-9._%+-]+@tzuchi\.com\.tw" placeholder="例如：tc150149@tzuchi.com.tw"><div class="helper">請填寫 @tzuchi.com.tw 院內信箱。</div></div><div class="field"><label for="cloud">院內雲端 <span class="required">*</span></label><input id="cloud" required inputmode="numeric" placeholder="例如：3918"></div></div></section>
<section class="card"><h2>2｜想討論哪一類教學工具？</h2><div class="field"><label for="toolType">需求類型 <span class="required">*</span></label><select id="toolType" required><option value="">請選擇</option><option>學習單／教師討論單</option><option>教學單張／圖卡</option><option>互動活動／小測驗</option><option>網站／表單／數位工具</option><option>教學影片／情境素材</option><option>其他教學工具</option></select></div><div class="field"><label for="need">需求說明 <span class="required">*</span></label><textarea id="need" required placeholder="例如：希望新進護理師在交班時能抓到關鍵資訊，目前只有紙本條列，想討論是否適合做成學習單、情境卡或互動工具。"></textarea><div class="helper">可寫：想教什麼、目前卡在哪裡、希望學員最後做到什麼。</div></div><label class="check"><input id="needHelp" type="checkbox"><span><strong>目前還沒有明確形式，希望先一起討論</strong><span>只有教學問題或初步想法也可以提出。</span></span></label></section>
<section class="card"><div class="privacy">請勿填入病人姓名、病歷號、床號或其他可辨識病人資訊。若有臨床案例，請以去識別化方式描述。</div><div class="field" style="margin-top:13px"><label for="note">其他補充</label><textarea id="note" placeholder="例如：預計使用對象、希望完成時間、目前已有的教材或限制。"></textarea></div><div class="actions"><button class="secondary" type="button" onclick="location.href='index.html'">返回首頁</button><button id="submit" class="primary" type="submit">送出需求討論 →</button></div><div id="status" class="status"></div></section>
</form>
<section id="success" class="card success"><div class="success-icon">✓</div><h2>需求已送出</h2><p>已收到你的教學工具需求，後續會依你留下的院內信箱或雲端聯繫討論。</p><div id="request" class="request"></div><div class="actions"><button class="secondary" onclick="location.href='index.html'">回 Learning Hub</button><button class="primary" onclick="resetForm()">再送一份需求</button></div></section>
</div>
<iframe id="backendFrame" name="teachingToolFrame" style="display:none"></iframe>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx8UPej4nsrJbwaN3VXDc3kDTDf4PTu1Amxzd4b7g_FzS25gEKucOwQI1Gag4I3TpR7/exec';let submissionActive=false,responseLoaded=false,pendingRequestId='';
function makeRequestId(){const d=new Date(),p=n=>String(n).padStart(2,'0'),date=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;const b=new Uint8Array(4);crypto.getRandomValues(b);return `EPA-RQ-${date}-${[...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}`}
function showStatus(msg,type){const el=document.getElementById('status');el.className='status show '+type;el.textContent=msg}
function postForm(data){const f=document.createElement('form');f.method='POST';f.action=API_URL;f.target='teachingToolFrame';f.style.display='none';for(const [k,v] of Object.entries(data)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');f.appendChild(i)}document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500)}
function finishSuccess(id){if(responseLoaded)return;responseLoaded=true;submissionActive=false;clearTimeout(window.confirmTimer);document.getElementById('submit').disabled=false;document.getElementById('form').style.display='none';document.getElementById('request').textContent='申請編號：'+id;document.getElementById('success').classList.add('show');scrollTo({top:0,behavior:'smooth'})}
function submitRequest(e){e.preventDefault();const form=document.getElementById('form');if(!form.checkValidity()){form.reportValidity();return}const unit=document.getElementById('unit').value.trim(),applicant=document.getElementById('applicant').value.trim(),email=document.getElementById('email').value.trim(),cloud=document.getElementById('cloud').value.trim(),toolType=document.getElementById('toolType').value.trim(),need=document.getElementById('need').value.trim(),note=document.getElementById('note').value.trim(),needHelp=document.getElementById('needHelp').checked;if(!unit||!applicant||!email||!cloud||!toolType||!need){showStatus('請完成所有必填欄位。','err');return}pendingRequestId=makeRequestId();submissionActive=true;responseLoaded=false;document.getElementById('submit').disabled=true;showStatus('正在送出需求…','ok');postForm({action:'application',requestId:pendingRequestId,unit,applicant,email,cloud,need:`【其他教學工具需求討論｜${toolType}】\n${need}`,needHelp:needHelp?'是':'否',note,scenariosJson:'[]',userAgent:navigator.userAgent});window.confirmTimer=setTimeout(()=>{if(!responseLoaded)showStatus('資料仍在確認中，請不要重複送出；頁面會繼續等待完成回應。','wait')},12000)}
document.getElementById('backendFrame').addEventListener('load',()=>{if(!submissionActive)return;setTimeout(()=>finishSuccess(pendingRequestId),600)});window.addEventListener('message',e=>{const d=e.data;if(!submissionActive||!d||d.source!=='epa-backend'||d.type!=='application')return;if(d.status==='ok')finishSuccess(d.requestId||pendingRequestId);else{submissionActive=false;clearTimeout(window.confirmTimer);document.getElementById('submit').disabled=false;showStatus('送出未完成：'+(d.message||'請稍後再試'),'err')}});
function resetForm(){document.getElementById('form').reset();document.getElementById('form').style.display='block';document.getElementById('success').classList.remove('show');document.getElementById('status').className='status';pendingRequestId='';submissionActive=false;responseLoaded=false;scrollTo({top:0,behavior:'smooth'})}
</script>
</body>
</html>
