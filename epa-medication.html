<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>給藥任務｜連接中</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#33383D;background:radial-gradient(circle at top right,rgba(217,166,166,.13),transparent 28%),radial-gradient(circle at top left,rgba(115,159,153,.11),transparent 30%),#FAF8F7}.box{width:min(100%,420px);padding:30px 24px;text-align:center;border:1px solid #E9E5E2;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(70,65,62,.07)}.dot{width:46px;height:46px;margin:0 auto 16px;border-radius:50%;border:5px solid #EAF3F1;border-top-color:#739F99;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:#777D81;font-size:13px;line-height:1.7}.error{color:#A96565}.back{display:inline-block;margin-top:18px;color:#527F79;font-size:12px;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="box"><div class="dot" id="spinner"></div><h1>正在開啟給藥任務</h1><p id="status">正在連接 Learning Hub 與 EPA 紀錄後端，請稍候一下 ♡</p><a class="back" href="index.html">← 回 Learning Hub</a></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('serviceWorker' in navigator)) throw new Error('此瀏覽器不支援必要的背景連線功能');
    await navigator.serviceWorker.register('./epa-backend-sw.js?v=20260827-fix2',{scope:'./'});
    await navigator.serviceWorker.ready;
    location.replace('./epa-medication-core.html?v=20260827-fix2');
  }catch(err){
    document.getElementById('spinner').style.display='none';
    status.className='error';
    status.textContent='目前無法啟動 EPA 工具：'+(err.message||err);
  }
})();
</script>
</body>
</html>
