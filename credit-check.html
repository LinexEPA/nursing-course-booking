<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F7">
  <title>EPAs 學分補查｜護理教育 Learning Hub</title>
  <style>
    :root{--bg:#faf8f7;--ink:#343a41;--muted:#788089;--blue:#527c9f;--blue-soft:#e6f0f9;--line:#e8e8e5}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 10%,#f5e8e6,transparent 33%),var(--bg)}
    .wrap{max-width:680px;margin:0 auto;padding:20px 16px 70px}.back{display:inline-block;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--blue);font-size:13px;font-weight:800;text-decoration:none}
    .sheet{margin-top:48px;background:#fff;border:1px solid var(--line);border-radius:23px;padding:34px;box-shadow:0 16px 40px rgba(64,70,80,.07)}.tag{color:var(--blue);font-weight:900;letter-spacing:.08em;font-size:12px}h1{font-size:clamp(31px,5.5vw,44px);line-height:1.2;margin:13px 0 9px}p{color:var(--muted);font-size:15px;line-height:1.8;margin:0}.badge{display:inline-block;padding:7px 11px;margin:22px 0;border-radius:999px;background:#fff1dc;color:#92642b;font-size:12px;font-weight:900}.cta{display:block;width:100%;padding:15px 18px;background:var(--blue);color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:850;text-align:center;text-decoration:none;cursor:pointer}.cta:disabled{background:#bbc8d1;cursor:default}.closed{display:none;padding:14px 16px;background:var(--blue-soft);color:#486d8b;border-radius:13px;font-size:14px;line-height:1.6}.micro{font-size:12px;color:#8c9298;text-align:center;margin-top:17px}
    @media(max-width:600px){.wrap{padding:12px 11px 40px}.sheet{margin-top:32px;padding:27px 20px}}
  </style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 回 Learning Hub</a>
  <section class="sheet">
    <div class="tag">115年度護理部 EPAs 系列課程</div>
    <h1>學分補查登記</h1>
    <p>請由各單位護理長統一填寫，三堂課程一次確認。</p>
    <span class="badge">受理至 115/12/05</span>
    <div id="openArea"><a id="formLink" class="cta" href="#">前往安全登記表單</a></div>
    <div id="pendingArea" class="closed">表單正在進行院內安全設定，尚未開放收件。</div>
    <div id="closedArea" class="closed">本次補查已截止，逾期申請請循護理部裁示辦理。</div>
    <div class="micro">教師個人資料不會儲存在 GitHub。</div>
  </section>
</main>
<script>
  // 獨立的 Apps Script Web App /exec 表單網址。
  // 絕不可改用原本的預約 Apps Script URL。
  const SECURE_CREDIT_FORM_URL = 'https://script.google.com/macros/s/AKfycbxyB3dYolmPYp5aE6E2jc-awyUPgdHKIhVG9JFTlNSkaVJRDnWJKSal0XjdolZKrlEB/exec';
  // 本次採登記後人工核對簽到單或紙本評核表；不使用信箱或填寫碼。
  const OPEN_FOR_REQUESTS = true;
  const expired = new Date() > new Date('2026-12-05T23:59:59+08:00');
  if (expired) {
    document.getElementById('openArea').style.display = 'none';
    document.getElementById('closedArea').style.display = 'block';
  } else if (!OPEN_FOR_REQUESTS || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(SECURE_CREDIT_FORM_URL)) {
    document.getElementById('openArea').style.display = 'none';
    document.getElementById('pendingArea').style.display = 'block';
  } else {
    const link = document.getElementById('formLink');
    link.href = SECURE_CREDIT_FORM_URL;
    link.rel = 'noopener noreferrer';
  }
</script>
</body>
</html>
