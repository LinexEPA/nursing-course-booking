<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>課程預約｜護理教育 Learning Hub</title>
<style>
:root{--bg:#FAF8F7;--primary:#739F99;--primary-dark:#527F79;--line:#E9E5E2;--text:#33383D;--muted:#777D81}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:var(--text)}body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}.hubbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(250,248,247,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.home{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--primary-dark);font-size:12px;font-weight:900;text-decoration:none}.label{color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap}.frame{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}@media(max-width:600px){.hubbar{padding:7px 9px}.home{min-height:40px;padding:8px 10px}.label{font-size:10px}}
</style>
</head>
<body>
<header class="hubbar"><a class="home" href="index.html">← 回 Learning Hub 首頁</a><span class="label">課程預約</span></header>
<iframe class="frame" src="booking.html" title="護理教育課程預約"></iframe>
</body>
</html>
