<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>課程預約｜護理教育 Learning Hub</title>
<style>
:root{--bg:#FAF8F7;--primary:#739F99;--primary-dark:#527F79;--primary-soft:#EAF3F1;--rose:#D9A6A6;--rose-soft:#F8EDED;--line:#E9E5E2;--text:#33383D;--muted:#777D81;--shadow:0 18px 48px rgba(70,65,62,.16)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:var(--text)}body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}.hubbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(250,248,247,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.hub-actions{display:flex;align-items:center;gap:8px}.home,.cancel-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;font-weight:900;text-decoration:none;cursor:pointer}.home{color:var(--primary-dark)}.cancel-link{color:#8C6666}.label{color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap}.frame{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:var(--bg)}.overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(43,46,47,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.overlay.show{display:flex}.modal{width:min(100%,470px);padding:24px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.modal-kicker{color:var(--primary-dark);font-size:11px;font-weight:900;letter-spacing:.08em}.modal h2{margin:4px 0 6px;font-size:24px}.modal p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.7}.close{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:50%;background:#F4F2F1;color:#777;font-size:18px;cursor:pointer}.field{margin-top:13px}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:900}.field input,.field select{width:100%;min-height:50px;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:#FCFBFA;font:inherit;outline:none}.field input:focus,.field select:focus{background:#fff;border-color:rgba(115,159,153,.55);box-shadow:0 0 0 4px rgba(115,159,153,.09)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{margin-top:5px;color:#999;font-size:10.5px}.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px;margin-top:18px}.btn{min-height:48px;border-radius:13px;font:inherit;font-weight:900;cursor:pointer}.btn.secondary{border:1px solid var(--line);background:#fff;color:var(--muted)}.btn.danger{border:0;background:#9B7373;color:#fff}.btn:disabled{opacity:.58;cursor:default}.status{display:none;margin-top:13px;padding:12px 13px;border-radius:13px;font-size:12px;line-height:1.65}.status.show{display:block}.status.wait{background:#FBF4E7;color:#7D673E}.status.ok{background:var(--primary-soft);color:#4F756E}.status.err{background:var(--rose-soft);color:#8B6262}@media(max-width:600px){.hubbar{padding:7px 9px}.home,.cancel-link{min-height:40px;padding:8px 10px}.label{display:none}.overlay{align-items:flex-end;padding:0}.modal{width:100%;border-radius:24px 24px 0 0;padding:22px 17px 28px}.actions,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hubbar"><div class="hub-actions"><a class="home" href="index.html">← 回 Learning Hub 首頁</a><button class="cancel-link" type="button" onclick="openCancelModal()">取消預約</button></div><span class="label">課程預約</span></header>
<iframe id="bookingFrame" class="frame" src="booking.html" title="護理教育課程預約"></iframe>
<div id="cancelOverlay" class="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cancelTitle">
    <div class="modal-head"><div><div class="modal-kicker">CANCEL BOOKING</div><h2 id="cancelTitle">取消預約</h2><p>請輸入原預約的日期、時段與院內信箱。核對成功後，該時段會重新開放。</p></div><button class="close" type="button" onclick="closeCancelModal()">×</button></div>
    <form id="cancelForm">
      <div class="grid2">
        <div class="field"><label for="cancelDate">預約日期</label><input id="cancelDate" name="date" type="date" required></div>
        <div class="field"><label for="cancelSlot">預約時段</label><select id="cancelSlot" name="slot" required><option value="">請選擇時段</option><option value="09:00">09:00</option><option value="15:00">15:00</option><option value="17:00">17:00</option></select></div>
      </div>
      <div class="field"><label for="cancelEmail">院內信箱</label><input id="cancelEmail" name="internalEmail" type="email" required pattern="[A-Za-z0-9._%+-]+@tzuchi\.com\.tw" placeholder="例如：tc150149@tzuchi.com.tw"><div class="hint">請使用當時預約填寫的院內信箱。</div></div>
      <div id="cancelStatus" class="status"></div>
      <div class="actions"><button class="btn secondary" type="button" onclick="closeCancelModal()">返回</button><button id="cancelButton" class="btn danger" type="submit">確認取消 →</button></div>
    </form>
  </div>
</div>
<iframe id="cancelSubmitFrame" name="cancelSubmitFrame" style="display:none"></iframe>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyD4bhLsFaSTAKqcUmei4-P8woaTw53hEVVBkjOZa2icG7Ki7dLgPLM902NnSrAJ5Qe/exec';
let cancelling=false;
function openCancelModal(){document.getElementById('cancelOverlay').classList.add('show');document.getElementById('cancelOverlay').setAttribute('aria-hidden','false');setTimeout(()=>document.getElementById('cancelDate').focus(),60)}
function closeCancelModal(){if(cancelling)return;document.getElementById('cancelOverlay').classList.remove('show');document.getElementById('cancelOverlay').setAttribute('aria-hidden','true')}
function showCancelStatus(text,type){const el=document.getElementById('cancelStatus');el.className='status show '+type;el.textContent=text}
function jsonp(action,extra={}){return new Promise((resolve,reject)=>{const cb='cancelCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');const cleanup=()=>{delete window[cb];if(script.parentNode)script.parentNode.removeChild(script)};window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(new Error('無法連線至預約系統'))};const p=new URLSearchParams({action,callback:cb,_:Date.now(),...extra});script.src=API_URL+'?'+p.toString();document.body.appendChild(script)})}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function waitForResult(requestId){for(let i=0;i<20;i++){await sleep(700);const result=await jsonp('bookingResult',{requestId});if(!result.pending)return result}throw new Error('timeout')}
function postCancel(data){const form=document.createElement('form');form.method='POST';form.action=API_URL;form.target='cancelSubmitFrame';form.style.display='none';Object.entries(data).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input)});document.body.appendChild(form);form.submit();setTimeout(()=>form.remove(),1500)}
function parseLocalDate(text){const parts=String(text||'').split('-').map(Number);if(parts.length!==3||parts.some(Number.isNaN))return null;return new Date(parts[0],parts[1]-1,parts[2])}
function refreshBookingAtDate(dateText){const frame=document.getElementById('bookingFrame');frame.onload=()=>{try{const win=frame.contentWindow;const target=parseLocalDate(dateText);if(!target||!win)return;const now=new Date();const monthDiff=(target.getFullYear()-now.getFullYear())*12+(target.getMonth()-now.getMonth());if(typeof win.goToday==='function')win.goToday();if(monthDiff!==0&&typeof win.changeMonth==='function')win.changeMonth(monthDiff);if(typeof win.selectDate==='function')win.selectDate(target);setTimeout(()=>{const slots=win.document.querySelector('.slots-card');if(slots)slots.scrollIntoView({behavior:'smooth',block:'start'})},100)}catch(error){console.error(error)}finally{frame.onload=null}};frame.src='booking.html?_='+Date.now()}
document.getElementById('cancelForm').addEventListener('submit',async event=>{event.preventDefault();if(cancelling)return;if(!event.currentTarget.checkValidity()){event.currentTarget.reportValidity();return}cancelling=true;const button=document.getElementById('cancelButton');button.disabled=true;button.textContent='取消中…';showCancelStatus('正在確認預約資料，請稍候…','wait');const dateValue=document.getElementById('cancelDate').value;const slotValue=document.getElementById('cancelSlot').value;const requestId='CANCEL-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);postCancel({action:'cancel',requestId,date:dateValue,slot:slotValue,internalEmail:document.getElementById('cancelEmail').value.trim()});try{const result=await waitForResult(requestId);if(result.success){showCancelStatus('預約已取消，正在回到該日期的時段。','ok');refreshBookingAtDate(dateValue);setTimeout(()=>{cancelling=false;button.disabled=false;button.textContent='確認取消 →';document.getElementById('cancelForm').reset();document.getElementById('cancelStatus').className='status';closeCancelModal()},900)}else{cancelling=false;button.disabled=false;button.textContent='確認取消 →';showCancelStatus(result.message||'取消失敗，請確認日期、時段與院內信箱。','err')}}catch(error){console.error(error);cancelling=false;button.disabled=false;button.textContent='確認取消 →';showCancelStatus('暫時無法確認取消結果，請稍後再試。','err')}});
document.getElementById('cancelOverlay').addEventListener('click',event=>{if(event.target.id==='cancelOverlay')closeCancelModal()});
</script>
</body>
</html>
