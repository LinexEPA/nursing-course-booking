<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF8F7">
<title>EPA 客製化申請｜確認測試</title>
<style>
:root{--bg:#FAF8F7;--card:#fff;--primary:#739F99;--primary-dark:#527F79;--primary-soft:#EAF3F1;--rose:#D9A6A6;--rose-dark:#936B6B;--rose-soft:#F8EDED;--yellow:#E8C98F;--yellow-soft:#FFF4DB;--text:#33383D;--muted:#777D81;--line:#E9E5E2;--shadow:0 12px 34px rgba(70,65,62,.07);--danger:#B87979}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top right,rgba(217,166,166,.13),transparent 28%),radial-gradient(circle at top left,rgba(115,159,153,.11),transparent 30%),var(--bg);line-height:1.65}.wrap{width:min(100%,860px);margin:0 auto;padding:16px 18px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.back{display:inline-flex;padding:9px 11px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--primary-dark);font-size:12px;font-weight:900;text-decoration:none}.badge{padding:7px 11px;border-radius:999px;background:var(--rose-soft);color:var(--rose-dark);font-size:11px;font-weight:900}.hero,.card{margin-bottom:12px;border:1px solid var(--line);background:rgba(255,255,255,.97);box-shadow:var(--shadow)}.hero{padding:28px 25px;border-radius:25px;background:linear-gradient(145deg,#fff,#F0F6F4)}.hero h1{margin:0 0 8px;font-size:clamp(30px,6vw,42px);line-height:1.18}.hero p{margin:0;color:var(--muted);font-size:14px}.card{padding:22px;border-radius:21px}.card h2{margin:0 0 5px;font-size:20px}.note{margin:0 0 16px;color:var(--muted);font-size:12.5px}.grid2,.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;font-size:13.5px;font-weight:900}input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;outline:none;background:#FCFBFA;color:var(--text);font:inherit}input{min-height:52px;padding:12px 13px;font-size:15px}textarea{min-height:105px;padding:12px 13px;resize:vertical;font-size:14px}.check{display:flex;gap:10px;padding:12px;border:1px solid rgba(232,201,143,.55);border-radius:13px;background:var(--yellow-soft);cursor:pointer}.check input{width:19px;height:19px;min-height:0;margin:2px 0 0;accent-color:var(--primary)}.check strong{display:block;font-size:13px}.check span span{display:block;margin-top:2px;color:#756A59;font-size:11.5px}.scenario{margin-top:11px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#FCFBFA}.scenario-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.scenario-title{font-weight:900}.remove{border:0;background:transparent;color:var(--danger);font-weight:900;cursor:pointer}.add{width:100%;min-height:48px;margin-top:11px;border:1px dashed rgba(115,159,153,.55);border-radius:13px;background:var(--primary-soft);color:var(--primary-dark);font-weight:900;cursor:pointer}.privacy{padding:12px 13px;border-radius:13px;background:var(--primary-soft);color:#557773;font-size:11.5px}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:9px;margin-top:14px}.secondary,.primary{min-height:52px;border-radius:13px;font:inherit;font-size:13.5px;font-weight:900;cursor:pointer}.secondary{border:1px solid var(--line);background:#fff;color:var(--primary-dark)}.primary{border:0;background:var(--primary);color:#fff}.primary:disabled{opacity:.58;cursor:default}.status{display:none;margin-top:12px;padding:13px;border-radius:13px;font-size:12.5px;line-height:1.65}.status.show{display:block}.status.ok{background:var(--primary-soft);color:#4F756E}.status.err{background:var(--rose-soft);color:#8B6262}.success{display:none;text-align:center}.success.show{display:block}.success h2{margin:0 0 7px;font-size:25px}.request-id{display:inline-block;margin-top:10px;padding:8px 11px;border-radius:999px;background:#F5F2F0;font-size:11px;font-weight:900}
@media(max-width:650px){.wrap{padding:9px 9px 48px}.hero{padding:22px 18px}.card{padding:16px}.grid2,.option-grid,.actions{grid-template-columns:1fr}input{min-height:56px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html">← 回 Learning Hub</a><span class="badge">EPA 申請測試</span></div>
  <section class="hero"><h1>單位客製化 EPA</h1><p>這次主要測試：資料寫入成功後，即使後端完成訊號較慢，也不會誤判成送出失敗。</p></section>

  <form id="requestForm" onsubmit="submitRequest(event)">
    <section class="card">
      <h2>1｜申請資料</h2><p class="note">請使用測試資料即可。</p>
      <div class="grid2">
        <div class="field"><label>單位 *</label><input id="unit" required placeholder="例如：TEST"></div>
        <div class="field"><label>申請人 *</label><input id="applicant" required placeholder="例如：測試護理長"></div>
        <div class="field"><label>院內信箱</label><input id="email" type="email" placeholder="可留白"></div>
        <div class="field"><label>院內雲端</label><input id="cloud" placeholder="可留白"></div>
      </div>
    </section>

    <section class="card">
      <h2>2｜EPA 主題／需求</h2><p class="note">只要有方向就可以。</p>
      <div class="field"><textarea id="need" placeholder="例如：希望新進護理師能辨識病人狀態改變，知道何時需要暫停處置並尋求協助。"></textarea></div>
      <label class="check"><input id="needHelp" type="checkbox"><span><strong>目前還沒有完整構想，希望協助一起整理</strong><span>只有教學問題或方向也可以送出。</span></span></label>
    </section>

    <section class="card">
      <h2>3｜情境</h2><p class="note">可新增多個；不需要每個欄位都填滿。</p>
      <div id="scenarios"></div>
      <button class="add" type="button" onclick="addScenario()">＋ 新增一個情境</button>
    </section>

    <section class="card">
      <div class="privacy">請勿填入病人姓名、病歷號、床號或其他可辨識病人資訊。</div>
      <div class="field" style="margin-top:13px"><label>其他補充</label><textarea id="note" placeholder="可留白"></textarea></div>
      <div class="actions"><button class="secondary" type="button" onclick="location.href='epa-medication.html'">先看範本體驗</button><button id="submitBtn" class="primary" type="submit">送出客製化需求 →</button></div>
      <div id="status" class="status"></div>
    </section>
  </form>

  <section id="success" class="card success">
    <h2>✓ 需求已確認</h2>
    <p>後端已回傳完成訊號，申請資料已送達。</p>
    <div id="requestId" class="request-id"></div>
    <div class="actions"><button class="secondary" onclick="location.href='index.html'">回 Learning Hub</button><button class="primary" onclick="resetForm()">再測一份</button></div>
  </section>
</div>

<iframe name="epaApplicationFrame" id="epaApplicationFrame" style="display:none"></iframe>
<script>
const EPA_API_URL='https://script.google.com/macros/s/AKfycbx8UPej4nsrJbwaN3VXDc3kDTDf4PTu1Amxzd4b7g_FzS25gEKucOwQI1Gag4I3TpR7/exec';
let scenarioCounter=0;
let pendingRequestId='';
let pendingTimer=null;

function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function addScenario(data={}){
  scenarioCounter++;
  const el=document.createElement('div');
  el.className='scenario';
  el.innerHTML=`<div class="scenario-head"><div class="scenario-title">情境</div><button type="button" class="remove" onclick="removeScenario(this)">移除此情境</button></div><div class="grid2"><div class="field"><label>任務／藥物／主題</label><input class="topic" value="${esc(data.topic||'')}" placeholder="例如：輸血、轉位、給藥"></div><div class="field"><label>情境簡稱</label><input class="name" value="${esc(data.name||'')}" placeholder="例如：早餐未進食＋準備給藥"></div></div><div class="field"><label>情境敘述</label><textarea class="text" placeholder="描述學員當下會看到、聽到或需要處理的情境。">${data.text||''}</textarea></div><div class="field"><label>排序／判斷選項（可留白）</label><div class="option-grid"><input class="a" placeholder="選項 A"><input class="b" placeholder="選項 B"><input class="c" placeholder="選項 C"><input class="d" placeholder="選項 D"></div></div>`;
  document.getElementById('scenarios').appendChild(el);renumber();
}
function removeScenario(btn){const all=document.querySelectorAll('.scenario');if(all.length<=1){alert('至少保留一個情境欄位；內容可以留白。');return}btn.closest('.scenario').remove();renumber()}
function renumber(){document.querySelectorAll('.scenario').forEach((el,i)=>el.querySelector('.scenario-title').textContent=`情境 ${i+1}`)}
function makeRequestId(){const d=new Date(),p=n=>String(n).padStart(2,'0'),date=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;const b=new Uint8Array(4);crypto.getRandomValues(b);return `EPA-RQ-${date}-${[...b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}`}
function collectScenarios(){return [...document.querySelectorAll('.scenario')].map((el,i)=>({sequence:i+1,topic:el.querySelector('.topic').value.trim(),name:el.querySelector('.name').value.trim(),text:el.querySelector('.text').value.trim(),optionA:el.querySelector('.a').value.trim(),optionB:el.querySelector('.b').value.trim(),optionC:el.querySelector('.c').value.trim(),optionD:el.querySelector('.d').value.trim()})).filter(x=>x.topic||x.name||x.text||x.optionA||x.optionB||x.optionC||x.optionD)}
function postForm(data){const f=document.createElement('form');f.method='POST';f.action=EPA_API_URL;f.target='epaApplicationFrame';f.style.display='none';Object.entries(data).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v??'');f.appendChild(i)});document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1500)}
function showStatus(msg,type='ok'){const s=document.getElementById('status');s.className=`status show ${type}`;s.textContent=msg}
function setButton(text,disabled){const b=document.getElementById('submitBtn');b.textContent=text;b.disabled=disabled}

function submitRequest(e){
  e.preventDefault();
  const unit=document.getElementById('unit').value.trim();
  const applicant=document.getElementById('applicant').value.trim();
  const need=document.getElementById('need').value.trim();
  const needHelp=document.getElementById('needHelp').checked;
  const scenarios=collectScenarios();
  if(!unit||!applicant){showStatus('請先填寫單位與申請人。','err');return}
  if(!need&&!needHelp&&!scenarios.length){showStatus('請至少填一段需求、放入一個情境，或勾選「希望協助一起整理」。','err');return}

  if(!pendingRequestId) pendingRequestId=makeRequestId();
  const data={action:'application',requestId:pendingRequestId,unit,applicant,email:document.getElementById('email').value.trim(),cloud:document.getElementById('cloud').value.trim(),need,needHelp:needHelp?'是':'否',note:document.getElementById('note').value.trim(),scenariosJson:JSON.stringify(scenarios),userAgent:navigator.userAgent};

  clearTimeout(pendingTimer);
  setButton('正在確認儲存…',true);
  showStatus(`正在送出，申請編號 ${pendingRequestId}。請先不要關閉頁面。`,'ok');
  postForm(data);

  pendingTimer=setTimeout(()=>{
    setButton('再次確認儲存狀態 →',false);
    showStatus(`資料可能已經送達，但瀏覽器尚未收到完成確認。請勿重新填寫；若要確認，直接按「再次確認儲存狀態」，系統會沿用同一申請編號 ${pendingRequestId}，不會另建一份申請。`,'ok');
  },15000);
}

window.addEventListener('message',e=>{
  const d=e.data;
  if(!d||d.source!=='epa-backend'||d.type!=='application') return;
  clearTimeout(pendingTimer);
  setButton('送出客製化需求 →',false);
  if(d.status==='ok'){
    const finalId=d.requestId||pendingRequestId;
    document.getElementById('requestForm').style.display='none';
    document.getElementById('requestId').textContent='申請編號：'+finalId;
    document.getElementById('success').classList.add('show');
    window.scrollTo({top:0,behavior:'smooth'});
  }else{
    showStatus('後端回覆：'+(d.message||'目前無法確認，請稍後再試。'),'err');
  }
});

function resetForm(){clearTimeout(pendingTimer);pendingRequestId='';document.getElementById('requestForm').reset();document.getElementById('scenarios').innerHTML='';addScenario();document.getElementById('requestForm').style.display='block';document.getElementById('success').classList.remove('show');document.getElementById('status').className='status';setButton('送出客製化需求 →',false);window.scrollTo({top:0,behavior:'smooth'})}
addScenario();
</script>
</body>
</html>
